name: CI

# The action is consumed as linchpin/docspress@v1, a tag that moves forward as
# fixes land. Nothing downstream pins a commit any more, so a merge to main is
# a merge to production for every repository that publishes documentation.
# These checks are what make that safe.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to diff against the base branch for the dist check below.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # dist/ is built on main by .github/workflows/build-dist.yml, not in a pull request.
      # Two branches rebuilding the same base produce divergent ncc output, so a committed
      # bundle conflicts on every merge and buries the real change: #12 and #13 differed by
      # ~18,000 lines each, and dist/index.js plus its map were the only paths that
      # conflicted between them.
      - name: Check the pull request does not contain dist
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          if echo "$changed" | grep -q '^dist/'; then
            echo "::error::This pull request modifies dist/. Remove those changes and commit source only — main rebuilds the bundle after the merge. To drop them: git checkout origin/${{ github.base_ref }} -- dist && git commit"
            exit 1
          fi

          echo "no dist changes in this pull request"
